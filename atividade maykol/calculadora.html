<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="icon" href="favicon.ico">
    <style>
        body {
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .top-right-image {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 80px;
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>
    <img src="calculadora.png" alt="Logo da calculadora" class="top-right-image">

    <h1>Calculadora</h1>

    <input type="number" id="numero1" placeholder="Primeiro número">

    <select id="operacao">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <input type="number" id="numero2" placeholder="Segundo número">
    
    <button onclick="calcular()">Calcular</button>

<br><br>

<a href="index.html">Voltar ao início</a>

<script src="calculadora.js"></script>
</body>
</html>
